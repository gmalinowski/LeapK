<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Glowing Outline Gradient -->
    <linearGradient id="outlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3daee9" />
      <stop offset="100%" stop-color="#1d80c3" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252a32" />
      <stop offset="100%" stop-color="#181a1f" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3daee9" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Window -->
  <rect x="14" y="16" width="100" height="92" rx="14" ry="14"
        fill="none" stroke="#00d2ff" stroke-width="7" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Window Card Shadow and Fill -->
  <rect x="16" y="18" width="96" height="88" rx="12" ry="12"
        fill="url(#cardBg)" filter="url(#cardShadow)" />

  <!-- Titlebar Separator -->
  <line x1="16" y1="42" x2="112" y2="42" stroke="#333942" stroke-width="2" />

  <!-- Window Titlebar Dots (KDE style on the RIGHT side) -->
  <!-- Minimize -->
  <circle cx="82" cy="30" r="4.5" fill="#3daee9" />
  <!-- Maximize -->
  <circle cx="93" cy="30" r="4.5" fill="#2ecc71" />
  <!-- Close -->
  <circle cx="104" cy="30" r="4.5" fill="#e74c3c" />

  <!-- Window Titlebar Indicator (left side) -->
  <rect x="25" y="27" width="22" height="6" rx="3" fill="#585d65" />

  <!-- Window Content Preview Lines -->
  <rect x="26" y="52" width="44" height="5" rx="2.5" fill="#383e46" />
  <rect x="26" y="63" width="76" height="4" rx="2" fill="#2a2f36" />
  <rect x="26" y="72" width="60" height="4" rx="2" fill="#2a2f36" />
  <rect x="26" y="81" width="70" height="4" rx="2" fill="#2a2f36" />

  <!-- Active Letter Badge in Window -->
  <rect x="76" y="65" width="24" height="24" rx="6" ry="6" fill="url(#badgeGrad)" filter="url(#neonGlow)" />
  <text x="88" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#181a1f" text-anchor="middle">A</text>

  <!-- Active Glowing Outline Perimeter -->
  <rect x="16" y="18" width="96" height="88" rx="12" ry="12"
        fill="none" stroke="url(#outlineGrad)" stroke-width="4.5" />
</svg>
